# Netlify deploys this app with its Next.js runtime (detected automatically).
# Required environment variables (Site configuration > Environment variables,
# scope "Functions" included): SESSION_SECRET, plus the Lovable/HubSpot logins
# you use. APP_URL defaults to the site's primary URL. See /tutorial.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The conversion runs in a background function (up to 15 minutes), because a
# normal function has about 30 seconds and heavy Lovable pages take longer.
[functions."convert-background"]
  node_bundler = "esbuild"
  external_node_modules = ["playwright-core", "@sparticuz/chromium-min", "@netlify/blobs"]
